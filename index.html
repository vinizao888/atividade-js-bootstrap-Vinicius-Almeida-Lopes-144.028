
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Estudos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <h1>Painel de Estudos</h1>
        </div>
    </nav>

    <main class="container">

        <section>
            <h2>Meus estudos</h2>
            <p>Tarefas e notas ficam aqui</p>
        </section>

        <section class="row">

            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h3>Tarefas</h3>
                        <p>Tarefas para fazer</p>
                        <span class="badge text-bg-secondary">Organização</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h3>Notas</h3>
                        <p>Calcular minhas notas</p>
                        <span class="badge text-bg-secondary">Notas</span>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h3>Tarefas prontas</h3>
                        <p>Conferir o que ja consegui terminar.</p>
                        <span class="badge text-bg-secondary">Progresso</span>
                    </div>
                </div>
            </div>

        </section>

        <section>
            <div class="alert alert-secondary" role="alert">
                Faça as tarefas!
            </div>

            <button type="button" class="btn btn-secondary">Ver tarefas</button>
        </section>

    </main>

    <footer>
        <p>atv dev web</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
